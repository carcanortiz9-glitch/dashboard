<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Semáforo">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Semáforo de Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<style>
/* Layout: analítica editorial sobre papel blanco — la calificación vive en la única tarjeta durazno, la semana y los clientes en tarjetas niebla, el día de enfoque flota con sombra suave. Solo tema claro, por diseño. */
:root{
  --ink:#17191c; --paper:#ffffff; --mist:#f2f2f3; --fog:#fafafb; --line:#ececec;
  --slate:#777b86; --ash:#979799; --smoke:#a3a6af;
  --peach:#fbe1d1; --sienna:#5d2a1a;
  --ok:#2f7350; --ok-soft:#e1efe6; --warn:#97590f; --warn-soft:#f5e8d0; --bad:#a63d33; --bad-soft:#f7dfdb; --none:#8b8d92; --none-soft:#e8e8ea;
  --bg:var(--paper); --surface:var(--paper); --surface-2:var(--mist); --ink-2:#4a4d55; --ink-3:var(--slate); --accent:var(--ink); --accent-soft:var(--peach); --on-accent:#ffffff;
  --f-serif:'Source Serif 4','Tiempos Headline',Georgia,serif;
  --f-sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-display:var(--f-serif); --f-body:var(--f-sans); --f-mono:var(--f-sans);
  --shadow-float:0 0 0 1px rgba(4,23,43,.05),0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
  --shadow-modal:0 0 0 1px rgba(0,0,0,.05),0 8px 40px rgba(0,0,0,.1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.login{min-height:60vh;display:grid;place-items:center}
.login .sheet{box-shadow:var(--shadow-float)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.45;font-weight:430;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 96px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
h1,h2{font-family:var(--f-serif)}
.num,.mono{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;font-weight:430;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 14px;width:100%}
input::placeholder,textarea::placeholder{color:var(--smoke)}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
label{display:block;font-size:13px;color:var(--slate);margin-bottom:6px;font-weight:430}
.eyebrow{font-size:14px;color:var(--ash);font-weight:400}
.muted{color:var(--slate)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:48px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:28px;letter-spacing:-.015em}
.lights{display:flex;gap:4px;padding:6px 8px;background:var(--ink);border-radius:999px}
.lights i{width:8px;height:8px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#e2665b}.lights i:nth-child(2){background:#e7a74a}.lights i:nth-child(3){background:#5cb07f}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:430;color:var(--slate)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{background:var(--ink);color:#fff}

.btn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:8px 18px;font-weight:430;display:inline-flex;align-items:center;gap:6px;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--mist)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2c2f34}
.btn.small{padding:5px 14px;font-size:13.5px}
.btn.ghost{border-color:transparent;color:var(--slate)}
.btn.ghost:hover{color:var(--ink);background:var(--mist)}
.monthnav{display:flex;align-items:center;gap:2px}
.monthnav b{font-weight:480;font-size:15px;min-width:128px;text-align:center}

.notice{background:var(--mist);border-radius:16px;padding:12px 16px;margin-bottom:24px;font-size:14px}

/* estado */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-ok{color:var(--ok);background:var(--ok-soft)}
.st-warn{color:var(--warn);background:var(--warn-soft)}
.st-bad{color:var(--bad);background:var(--bad-soft)}
.st-none,.st-nogoal,.st-nodata,.st-track{color:var(--none);background:var(--none-soft)}

/* avatares */
.av{width:26px;height:26px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 1px var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;letter-spacing:.02em;flex:none;color:var(--ink)}
.av.lg{width:40px;height:40px;font-size:12.5px}
.av[data-s="ok"]{box-shadow:0 0 0 2px var(--ok)}
.av[data-s="warn"]{box-shadow:0 0 0 2px var(--warn)}
.av[data-s="bad"]{box-shadow:0 0 0 2px var(--bad)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;margin-bottom:80px}
@media (max-width:900px){.hero{grid-template-columns:1fr;margin-bottom:56px}}
.feature{background:var(--peach);color:var(--sienna);border-radius:24px;padding:28px 32px 32px;display:flex;flex-direction:column;gap:18px}
.feature .eyebrow{color:var(--sienna);opacity:.7}
.feature .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.feature .big{font-family:var(--f-serif);font-size:clamp(84px,12vw,136px);line-height:.95;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.feature .big small{font-size:.42em;letter-spacing:-.01em;margin-left:4px}
.feature p{margin:0;font-size:16px;max-width:46ch}
.feature .btn.ghost{color:var(--sienna)}
.feature .btn.ghost:hover{background:rgba(93,42,26,.08)}
.roster{display:flex;gap:10px;flex-wrap:wrap}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.panel{background:var(--mist);border-radius:24px;padding:24px}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.wday{border-radius:16px;background:var(--paper);padding:10px;min-height:104px;display:flex;flex-direction:column;gap:6px;border:1px solid transparent;text-align:left}
.wday:hover{border-color:var(--line)}
.wday.today{border-color:var(--ink)}
.wday .d{font-size:12.5px;color:var(--slate)}
.chip{display:flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.2;min-width:0}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.chip span:last-child{display:none}}
.alerts{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.alert{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;padding:10px 12px;border-radius:16px;background:var(--paper)}
.alert .grow{flex:1;min-width:160px}

/* tarjetas de cliente */
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sectionhead h2{font-size:clamp(32px,4vw,44px);letter-spacing:-.015em;line-height:1.15}
.panel .sectionhead h2,.float .sectionhead h2{font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{background:var(--mist);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chead h3{font-family:var(--f-sans);font-size:18px;font-weight:500;letter-spacing:-.009em;display:flex;align-items:center;gap:10px}
.funnel{font-size:13.5px;color:var(--slate);margin-top:4px}
.bigscore{font-family:var(--f-serif);font-size:44px;line-height:1;letter-spacing:-.02em;text-align:right;font-variant-numeric:tabular-nums}
.mrows{display:flex;flex-direction:column;gap:12px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:5px 8px;font-size:14px}
.mrow .v{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--slate)}
.mrow .v b{color:var(--ink);font-weight:500}
.bar{grid-column:1/-1;height:6px;border-radius:999px;background:var(--paper);position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:currentColor}
.bar .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;border-top:1px solid #e3e3e6;padding-top:14px;margin:0}
.kv dt{color:var(--slate)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--slate);margin-top:auto;flex-wrap:wrap}
.cfoot a{color:var(--ink);text-decoration:none}
.cfoot a:hover{text-decoration:underline}
.empty{background:var(--fog);border-radius:24px;padding:40px;text-align:center;color:var(--slate)}

/* calendario */
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
@media (max-width:980px){.calwrap{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cal .h{font-size:13px;color:var(--ash);padding:0 6px 6px}
.cell{border:1px solid transparent;background:var(--mist);border-radius:16px;padding:8px;min-height:96px;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.cell:hover{background:#ebebed}
.cell .n{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--slate);font-variant-numeric:tabular-nums}
.cell.today .n b{background:var(--ink);color:#fff;border-radius:999px;padding:0 7px;font-weight:500}
.cell.sel{border-color:var(--ink);background:var(--paper)}
.cell.past{opacity:.6}
.cell .dot{width:6px;height:6px;border-radius:50%;background:var(--sienna)}
.cell .ov{font-size:11px;color:var(--sienna)}
.cell .chip span:last-child{display:none}
.cell .chips{display:flex;gap:4px;flex-wrap:wrap}
.float{background:var(--paper);border-radius:20px;box-shadow:var(--shadow-float);padding:24px;min-width:0}
.base{display:grid;gap:10px;margin-bottom:16px}
.baserow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center}
.baserow b{font-weight:500}
@media (max-width:520px){.baserow{grid-template-columns:1fr}}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tog{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px 3px 3px;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.tog[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.dayhead h2{font-size:32px;letter-spacing:-.015em;line-height:1.15}
.sess{border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px;background:var(--fog);box-shadow:0 0 0 1px var(--line)}
.sess + .sess{margin-top:14px}
.sess h3{font-family:var(--f-sans);font-size:17px;font-weight:500;display:flex;align-items:center;gap:10px}
.checks{display:flex;flex-direction:column;gap:7px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input,.task input[type=checkbox]{width:16px;height:16px;margin-top:2px;accent-color:var(--ink);flex:none}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:10px;font-size:14px}
.task.done span{text-decoration:line-through;color:var(--smoke)}
.task span{flex:1;min-width:0}
.task small{color:var(--ash)}
.addrow{display:flex;gap:6px;align-items:center}
.prev{background:var(--paper);border-radius:16px;padding:14px;box-shadow:0 0 0 1px var(--line)}
.savebar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--slate)}
.dirty{color:var(--sienna);font-weight:500}

/* histórico */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-sans);font-size:11px;fill:var(--ash)}
.tablewrap{overflow-x:auto;margin-top:24px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:13px;color:var(--ash);font-weight:400}
td.c{text-align:center}

/* metas */
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
@media (max-width:420px){.cfg,.grid{grid-template-columns:1fr}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
.card input,.card textarea,.card select{background:var(--paper);border-color:transparent}
.formula{font-size:15px;color:var(--ink-2);max-width:68ch;display:flex;flex-direction:column;gap:10px}

/* modal y aviso */
.modal{position:fixed;inset:0;background:rgba(23,25,28,.32);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--paper);border-radius:24px;width:min(480px,100%);max-height:90vh;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-modal)}
.sheet h2{font-size:32px;letter-spacing:-.015em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;z-index:60}
@media (prefers-reduced-motion:no-preference){.bar .fill{transition:width .4s ease}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div><h1>Semáforo de Clientes</h1></div>
    <nav class="tabs" id="tabs">
      <button data-action="tab" data-tab="panel">Panel</button>
      <button data-action="tab" data-tab="calendario">Calendario</button>
      <button data-action="tab" data-tab="historico">Histórico</button>
      <button data-action="tab" data-tab="clientes">Metas y clientes</button>
    </nav>
  </header>
  <div id="notice"></div>
  <main id="view"><div class="empty">Cargando tus clientes…</div></main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
const DAYS=['mon','tue','wed','thu','fri'];
const DAY_LABEL={mon:'Lunes',tue:'Martes',wed:'Miércoles',thu:'Jueves',fri:'Viernes'};
const DAY_SHORT=['dom','lun','mar','mié','jue','vie','sáb'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const CHECKS=['Métricas del mes contra meta y ritmo','Creativos: rendimiento, frecuencia y fatiga','Segmentación, pujas y presupuesto','Calidad de los leads con el cliente','Embudo: landing, WhatsApp o agenda'];

const S={clients:[],results:{},schedule:null,days:{},sessions:{},settings:{green:90,orange:70},loaded:false,dbOk:null};
const pad=n=>String(n).padStart(2,'0');
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monthKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const todayKey=()=>dateKey(new Date());
const parseDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const dim=mk=>{const [y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate()};
const monthName=mk=>{const [y,m]=mk.split('-').map(Number);return MONTHS[m-1]+' '+y};
const addMonths=(mk,n)=>{const [y,m]=mk.split('-').map(Number);return monthKey(new Date(y,m-1+n,1))};
const dowKey=d=>['sun','mon','tue','wed','thu','fri','sat'][d.getDay()];
const longDate=k=>{const d=parseDate(k);return `${['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`};
const shortDate=k=>{const d=parseDate(k);return `${DAY_SHORT[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('es-MX').format(Math.round(n));
const money=(n,cur)=>n==null?'—':new Intl.NumberFormat('es-MX',{style:'currency',currency:cur||'MXN',maximumFractionDigits:n<100?2:0}).format(n);
const clone=o=>JSON.parse(JSON.stringify(o));
const cvar=c=>`var(--c${c?.color||1})`;
const ini=c=>(c?.name||'?').normalize('NFD').replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase();
const av=(c,cls='')=>`<span class="av ${cls}" aria-hidden="true">${ini(c)}</span>`;
const byId=id=>S.clients.find(c=>c.id===id);

const now=new Date();
const UI={tab:'panel',month:monthKey(now),calMonth:monthKey(now),day:todayKey(),editDay:false,editBase:false};
const drafts={s:{},c:{}};
let db=null;

/* ---------- cálculo ---------- */
function paceFor(mk,r){
  const days=dim(mk);
  if(r?.asOf&&r.asOf.startsWith(mk))return Math.min(1,parseDate(r.asOf).getDate()/days);
  const cur=monthKey(new Date());
  if(mk<cur)return 1;
  if(mk>cur)return 0;
  return new Date().getDate()/days;
}
function statusOf(score){return score==null?'none':score>=S.settings.green?'ok':score>=S.settings.orange?'warn':'bad'}
function ratioStatus(r){return r==null?'none':r>=S.settings.green/100?'ok':r>=S.settings.orange/100?'warn':'bad'}
function evalClient(c,mk){
  const r=S.results[mk+'_'+c.id];
  const snap=r?.goals||{metrics:(c.metrics||[]).map(m=>({key:m.key,goal:m.goal||0})),cprTarget:c.cprTarget||0,budget:c.budget||0};
  const goalOf=k=>Number((snap.metrics||[]).find(m=>m.key===k)?.goal)||0;
  const pace=paceFor(mk,r);
  const rows=(c.metrics||[]).map(m=>{const goal=goalOf(m.key);const value=Number(r?.values?.[m.key])||0;const expected=goal*pace;return {m,goal,value,expected,ratio:goal>0&&expected>0?value/expected:null}});
  const scored=rows.filter(x=>x.goal>0);
  const resultCount=rows.filter(x=>x.m.result).reduce((a,x)=>a+x.value,0);
  const spend=Number(r?.spend)||0;
  const cpr=resultCount>0&&spend>0?spend/resultCount:null;
  const cprTarget=Number(snap.cprTarget)||0,budget=Number(snap.budget)||0;
  let costScore=null;
  if(r&&cprTarget>0&&spend>0)costScore=cpr?Math.min(1,cprTarget/cpr):0;
  let score=null,status='nogoal';
  if(scored.length){
    if(!r)status='nodata';
    else{
      const vol=scored.reduce((a,x)=>a+Math.min(1,x.ratio??0),0)/scored.length;
      score=Math.round((costScore==null?vol:vol*0.6+costScore*0.4)*100);
      status=statusOf(score);
    }
  }else if(r)status='track';
  const spendPace=budget>0&&pace>0&&r?spend/(budget*pace):null;
  return {c,r,rows,pace,score,status,cpr,cprTarget,budget,spend,spendPace,resultCount};
}
function globalScore(mk){
  const ev=S.clients.map(c=>evalClient(c,mk));
  const s=ev.filter(e=>e.score!=null);
  return {ev,score:s.length?Math.round(s.reduce((a,e)=>a+e.score,0)/s.length):null,n:s.length};
}
function clientsForDate(k){
  if(S.days[k])return (S.days[k].clients||[]).filter(byId);
  return ((S.schedule||{})[dowKey(parseDate(k))]||[]).filter(byId);
}
function nextDayFor(id){
  const d=new Date();d.setHours(0,0,0,0);
  for(let i=0;i<21;i++){const k=dateKey(d);const w=d.getDay();if(w>0&&w<6&&clientsForDate(k).includes(id))return k;d.setDate(d.getDate()+1)}
  return null;
}
const STATUS_LABEL={ok:'Verde',warn:'Naranja',bad:'Rojo',nogoal:'Meta pendiente',nodata:'Sin captura',track:'Solo seguimiento',none:'Sin datos'};

/* ---------- render ---------- */
let pending=false;
function scheduleRender(){
  const a=document.activeElement;
  if(a&&a.matches('input,textarea,select')&&document.getElementById('view').contains(a)){pending=true;return}
  render();
}
document.addEventListener('focusout',()=>{if(!pending)return;setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches('input,textarea,select'))){pending=false;render()}},0)});

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===UI.tab?'page':'false'));
  const n=document.getElementById('notice');
  n.innerHTML=S.dbOk===false?'<div class="notice">No se pudo conectar con el servidor. Revisa tu internet; el tablero vuelve a intentarlo solo.</div>':'';
  const v=document.getElementById('view');
  document.getElementById('tabs').hidden=!!S.needLogin;
  if(S.needLogin){v.innerHTML=loginView();setTimeout(()=>document.getElementById('lp')?.focus(),0);return}
  if(!S.loaded&&S.dbOk!==false){v.innerHTML='<div class="empty">Cargando tus clientes…</div>';return}
  if(!S.clients.length){v.innerHTML='<div class="empty">Todavía no hay clientes cargados en el tablero.</div>';return}
  v.innerHTML={panel:viewPanel,calendario:viewCalendar,historico:viewHistory,clientes:viewClients}[UI.tab]();
}

function monthNav(action,mk){
  return `<div class="monthnav"><button class="btn ghost small" data-action="${action}" data-d="-1" aria-label="Mes anterior">‹</button><b>${monthName(mk)}</b><button class="btn ghost small" data-action="${action}" data-d="1" aria-label="Mes siguiente">›</button></div>`;
}

function weekDays(){
  const d=new Date();d.setHours(0,0,0,0);
  const w=d.getDay();
  if(w===6)d.setDate(d.getDate()+2);else if(w===0)d.setDate(d.getDate()+1);else d.setDate(d.getDate()-(w-1));
  return DAYS.map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return dateKey(x)});
}
const chipHTML=c=>`<div class="chip">${av(c)}<span>${esc(c.name)}</span></div>`;

function viewPanel(){
  const mk=UI.month,{ev,score,n}=globalScore(mk);
  const counts={ok:0,warn:0,bad:0,other:0};ev.forEach(e=>{if(e.status in counts)counts[e.status]++;else counts.other++});
  const cur=mk===monthKey(new Date());
  const day=new Date().getDate();
  const sub=cur?`Día ${day} de ${dim(mk)}. Hoy deberías llevar el ${Math.round(day/dim(mk)*100)}% de cada meta.`:mk<monthKey(new Date())?'Mes cerrado: cuenta el último corte que capturaste.':'Este mes todavía no empieza.';
  const today=todayKey();
  const week=weekDays().map(k=>`<button class="wday ${k===today?'today':''}" data-action="gotoday" data-date="${k}"><span class="d">${shortDate(k)}</span>${clientsForDate(k).map(id=>chipHTML(byId(id))).join('')||'<span class="muted" style="font-size:12px">Libre</span>'}</button>`).join('');
  const atRisk=ev.filter(e=>e.status==='bad'||e.status==='warn').sort((a,b)=>a.score-b.score);
  const wd=new Date().getDay();
  const alerts=cur&&atRisk.length?`<div class="alerts">${atRisk.map(e=>{const nx=nextDayFor(e.c.id);const isToday=clientsForDate(today).includes(e.c.id);return `<div class="alert"><span class="pill st-${e.status}">${e.score}%</span><span class="grow"><b>${esc(e.c.name)}</b> <span class="muted">· ${isToday?'le toca hoy':nx?'su próximo día es '+shortDate(nx):'sin día asignado'}</span></span>${!isToday&&wd>0&&wd<6?`<button class="btn small" data-action="addtoday" data-id="${e.c.id}">Atender hoy</button>`:''}</div>`}).join('')}</div>`:'';
  return `
  <section class="hero">
    <div class="feature">
        <div class="row"><span class="eyebrow">Tu calificación</span>${monthNav('month',mk)}</div>
        <div class="big">${score==null?'—':score}${score==null?'':'<small>%</small>'}</div>
        <p>${sub} ${n?`Promedio de ${n} cliente${n>1?'s':''} con meta y captura.`:'Aparece en cuanto un cliente tenga meta y números capturados.'}</p>
        <div class="roster">${ev.map(e=>`<span class="av lg" data-s="${e.status}" title="${esc(e.c.name)} · ${e.score!=null?e.score+'%':STATUS_LABEL[e.status]}">${ini(e.c)}</span>`).join('')}</div>
        <div class="counts">
          <span class="pill st-ok">${counts.ok} verde</span><span class="pill st-warn">${counts.warn} naranja</span><span class="pill st-bad">${counts.bad} rojo</span>${counts.other?`<span class="pill st-none">${counts.other} sin calificar</span>`:''}
        </div>
    </div>
    <div class="panel">
      <div class="sectionhead" style="margin:0"><h2>Esta semana</h2><button class="btn ghost small" data-action="tab" data-tab="calendario">Abrir calendario</button></div>
      <div class="week">${week}</div>
      ${alerts}
    </div>
  </section>
  <div class="sectionhead"><h2>Clientes</h2><span class="muted" style="font-size:12px">La raya negra en cada barra marca dónde deberías ir hoy.</span></div>
  <section class="grid">${ev.map(cardHTML).join('')}</section>`;
}

function cardHTML(e){
  const c=e.c,cur=c.currency||'MXN';
  const rows=e.rows.map(x=>{
    if(!x.goal)return `<div class="mrow"><span>${esc(x.m.label)}</span><span class="v"><b>${fmt(x.value)}</b> <span class="muted">· seguimiento</span></span></div>`;
    const st=ratioStatus(x.ratio);
    return `<div class="mrow"><span>${esc(x.m.label)}</span><span class="v"><b>${fmt(x.value)}</b> / ${fmt(x.goal)}</span>
      <div class="bar" style="color:var(--${st==='none'?'none':st})"><span class="fill" style="width:${Math.min(100,x.value/x.goal*100)}%"></span><i class="tick" style="left:calc(${Math.min(100,e.pace*100)}% - 1px)" title="Ritmo esperado: ${fmt(x.expected)}"></i></div></div>`;
  }).join('');
  const cprSt=e.cpr&&e.cprTarget?(e.cpr<=e.cprTarget?'ok':e.cpr<=e.cprTarget*1.25?'warn':'bad'):null;
  const spendLbl=e.spendPace==null?'':e.spendPace<0.85?' · subejecución':e.spendPace>1.1?' · sobreejecución':' · en ritmo';
  const pillTxt=e.score!=null?`${STATUS_LABEL[e.status]}`:STATUS_LABEL[e.status];
  return `<article class="card s-${e.status}">
    <div class="chead"><div style="min-width:0"><h3>${av(c,'lg')}${esc(c.name)}</h3><div class="funnel">${esc(c.funnel||'')}${c.platforms?` · ${esc(c.platforms)}`:''}</div></div>
      <div><div class="bigscore">${e.score!=null?e.score+'%':''}</div><div style="margin-top:4px;text-align:right"><span class="pill st-${e.status}">${pillTxt}</span></div></div></div>
    <div class="mrows">${rows}</div>
    <dl class="kv">
      <dt>${esc(c.cprLabel||'Costo por resultado')}</dt><dd ${cprSt?`style="color:var(--${cprSt})"`:''}>${money(e.cpr,cur)}${e.cprTarget?` <span class="muted">/ meta ${money(e.cprTarget,cur)}</span>`:''}</dd>
      <dt>Inversión</dt><dd>${e.r?money(e.spend,cur):'—'}${e.budget?` <span class="muted">/ ${money(e.budget,cur)}${spendLbl}</span>`:''}</dd>
    </dl>
    <div class="cfoot"><span>${e.r?`Corte al ${shortDate(e.r.asOf)}`:'Sin captura este mes'}${e.status==='nogoal'?` · <a href="#clientes" data-action="tab" data-tab="clientes" style="color:var(--accent)">definir metas</a>`:''}</span><button class="btn small primary" data-action="capture" data-id="${c.id}">Capturar números</button></div>
  </article>`;
}

/* ---------- calendario ---------- */
function viewCalendar(){
  const mk=UI.calMonth,[y,m]=mk.split('-').map(Number),days=dim(mk),today=todayKey();
  let cells='',first=true;
  for(let d=1;d<=days;d++){
    const dt=new Date(y,m-1,d),w=dt.getDay();if(w===0||w===6)continue;
    const k=dateKey(dt),ids=clientsForDate(k);
    const hasNotes=Object.values(S.sessions).some(s=>s.date===k);
    cells+=`<button class="cell ${k===today?'today':''} ${k===UI.day?'sel':''} ${k<today?'past':''}" ${first?`style="grid-column:${w}"`:''} data-action="pickday" data-date="${k}">
      <span class="n"><b>${d}</b>${hasNotes?'<span class="dot" title="Tiene bitácora"></span>':''}</span>
      <span class="chips">${ids.map(id=>`<span title="${esc(byId(id).name)}">${av(byId(id))}</span>`).join('')}</span>${S.days[k]?'<span class="ov">ajustado</span>':''}</button>`;
    first=false;
  }
  const base=UI.editBase?`<div class="panel base"><div class="sectionhead" style="margin:0"><h2>Semana base</h2><span class="muted" style="font-size:12px">Se repite cada semana. Los ajustes de un día puntual no la cambian.</span></div>
    ${DAYS.map(dk=>`<div class="baserow"><b>${DAY_LABEL[dk]}</b><div class="toggles">${S.clients.map(c=>`<button class="tog" aria-pressed="${((S.schedule||{})[dk]||[]).includes(c.id)}" data-action="togglebase" data-day="${dk}" data-id="${c.id}">${av(c)}${esc(c.name)}</button>`).join('')}</div></div>`).join('')}
    <div><button class="btn small" data-action="editbase">Listo</button></div></div>`:'';
  return `<div class="calwrap">
    <section>
      <div class="sectionhead">${monthNav('calmonth',mk)}<button class="btn small" data-action="editbase">${UI.editBase?'Cerrar semana base':'Editar semana base'}</button></div>
      ${base}
      <div class="cal">${['Lun','Mar','Mié','Jue','Vie'].map(h=>`<div class="h">${h}</div>`).join('')}${cells}</div>
    </section>
    <section class="float">${dayPanel(UI.day)}</section>
  </div>`;
}

function blankSession(){return {checks:[],estrategia:'',aprendizajes:'',pendientes:[],newtask:''}}
function sessionOf(sid){return drafts.s[sid]||S.sessions[sid]||blankSession()}

function dayPanel(k){
  const w=parseDate(k).getDay();
  if(w===0||w===6)return `<div class="dayhead"><h2>${longDate(k)}</h2></div><p class="muted">Fin de semana. Elige un día de lunes a viernes en el calendario.</p>`;
  const ids=clientsForDate(k);
  const editor=UI.editDay?`<div class="prev" style="margin-bottom:12px"><label>¿A quién atiendes este día?</label><div class="toggles">${S.clients.map(c=>`<button class="tog" aria-pressed="${ids.includes(c.id)}" data-action="toggleday" data-id="${c.id}">${av(c)}${esc(c.name)}</button>`).join('')}</div>
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn small" data-action="editday">Listo</button>${S.days[k]?'<button class="btn small ghost" data-action="resetday">Volver a la semana base</button>':''}</div></div>`:'';
  return `<div class="dayhead"><div><span class="eyebrow">Día de enfoque${S.days[k]?' · ajustado':''}</span><h2>${longDate(k)}</h2></div><button class="btn small" data-action="editday">${UI.editDay?'Cerrar':'Cambiar clientes'}</button></div>
    ${editor}
    ${ids.length?ids.map(id=>sessionBlock(k,byId(id))).join(''):'<div class="empty">Este día no tiene clientes asignados.</div>'}`;
}

function sessionBlock(k,c){
  const sid=k+'_'+c.id,s=sessionOf(sid),stored=S.sessions[sid],dirty=!!drafts.s[sid];
  const e=evalClient(c,k.slice(0,7));
  const prev=Object.entries(S.sessions).filter(([id,x])=>x.client===c.id&&x.date<k).flatMap(([id,x])=>(x.pendientes||[]).map((p,i)=>({id,i,p,date:x.date}))).filter(o=>!o.p.done);
  const metricLine=e.rows.map(x=>`${esc(x.m.label)} <b class="num">${fmt(x.value)}</b>${x.goal?`<span class="muted num">/${fmt(x.goal)}</span>`:''}`).join(' · ');
  return `<div class="sess">
    <div class="chead"><div><h3>${av(c,'lg')}${esc(c.name)}</h3><div class="funnel">${e.r?metricLine:'Sin captura de números este mes'}</div></div><span class="pill st-${e.status}">${e.score!=null?e.score+'% · ':''}${STATUS_LABEL[e.status]}</span></div>
    ${prev.length?`<div class="prev"><label>Pendientes que quedaron abiertos</label><div class="tasks">${prev.map(o=>`<label class="task" style="margin:0;color:var(--ink);font-weight:400"><input type="checkbox" data-action="doneprev" data-sid="${o.id}" data-i="${o.i}"><span>${esc(o.p.t)}</span><small>${shortDate(o.date)}</small></label>`).join('')}</div></div>`:''}
    <div><label>Revisión</label><div class="checks">${CHECKS.map((t,i)=>`<label class="check" style="margin:0;color:var(--ink);font-weight:400"><input type="checkbox" data-s="${sid}" data-f="check" data-i="${i}" ${s.checks?.[i]?'checked':''}><span>${t}</span></label>`).join('')}</div></div>
    <div><label for="es-${sid}">Estrategia e ideas</label><textarea id="es-${sid}" data-s="${sid}" data-f="estrategia" placeholder="Qué vamos a probar, cómo escalamos, qué cambiamos">${esc(s.estrategia)}</textarea></div>
    <div><label>Siguientes pasos</label><div class="tasks">${(s.pendientes||[]).map((p,i)=>`<div class="task ${p.done?'done':''}"><input type="checkbox" data-s="${sid}" data-f="taskdone" data-i="${i}" ${p.done?'checked':''} aria-label="Marcar como hecho"><span>${esc(p.t)}</span><button class="btn ghost small" data-action="deltask" data-sid="${sid}" data-i="${i}" aria-label="Quitar">×</button></div>`).join('')}
      <div class="addrow"><input id="nt-${sid}" data-s="${sid}" data-f="newtask" value="${esc(s.newtask||'')}" placeholder="Agregar paso y presionar Enter"><button class="btn small" data-action="addtask" data-sid="${sid}">Agregar</button></div></div></div>
    <div><label for="ap-${sid}">Avances y aprendizajes</label><textarea id="ap-${sid}" data-s="${sid}" data-f="aprendizajes" placeholder="Qué funcionó, qué no, qué dijo el cliente">${esc(s.aprendizajes)}</textarea></div>
    <div class="savebar"><span class="${dirty?'dirty':''}" data-dirty="${sid}">${dirty?'Cambios sin guardar':stored?.updatedAt?'Guardado el '+new Date(stored.updatedAt).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Sin bitácora todavía'}</span><button class="btn primary small" data-action="savesession" data-sid="${sid}" data-date="${k}" data-id="${c.id}">Guardar bitácora</button></div>
  </div>`;
}

/* ---------- histórico ---------- */
function viewHistory(){
  const months=[...new Set(Object.values(S.results).map(r=>r.month))].sort();
  if(!months.length)return `<div class="empty">El histórico se arma solo cuando captures números. Cada mes queda guardado con su calificación final.</div>`;
  const data=months.map(mk=>({mk,...globalScore(mk)}));
  const W=720,H=230,L=40,R=16,T=16,B=34,iw=W-L-R,ih=H-T-B;
  const x=i=>L+(months.length===1?iw/2:i*iw/(months.length-1)),y=v=>T+ih*(1-v/100);
  const g=S.settings.green,o=S.settings.orange;
  const pts=data.filter(d=>d.score!=null).map(d=>[x(data.indexOf(d)),y(d.score),d]);
  const svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calificación global por mes">
    <rect x="${L}" y="${y(100)}" width="${iw}" height="${y(g)-y(100)}" fill="var(--ok-soft)"/>
    <rect x="${L}" y="${y(g)}" width="${iw}" height="${y(o)-y(g)}" fill="var(--warn-soft)"/>
    <rect x="${L}" y="${y(o)}" width="${iw}" height="${y(0)-y(o)}" fill="var(--bad-soft)" opacity=".6"/>
    ${[0,o,g,100].map(v=>`<text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')}
    ${data.map((d,i)=>`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${MONTHS[+d.mk.slice(5)-1].slice(0,3)} ${d.mk.slice(2,4)}</text>`).join('')}
    ${pts.length>1?`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="var(--sienna)" stroke-width="2"/>`:''}
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--${statusOf(p[2].score)})" stroke="var(--surface)" stroke-width="2"/><text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" style="fill:var(--ink);font-weight:500">${p[2].score}%</text>`).join('')}
  </svg>`;
  const table=`<div class="tablewrap"><table><thead><tr><th>Cliente</th>${months.map(mk=>`<th class="c">${monthName(mk)}</th>`).join('')}</tr></thead><tbody>
    ${S.clients.map(c=>`<tr><td>${chipHTML(c)}</td>${months.map(mk=>{const e=evalClient(c,mk);return `<td class="c">${e.score!=null?`<span class="pill st-${e.status}">${e.score}%</span>`:'<span class="muted">—</span>'}</td>`}).join('')}</tr>`).join('')}
    <tr><td><b>Global</b></td>${data.map(d=>`<td class="c">${d.score!=null?`<b class="num">${d.score}%</b>`:'—'}</td>`).join('')}</tr>
  </tbody></table></div>`;
  return `<section class="panel"><div class="sectionhead"><h2>Calificación global por mes</h2></div>${svg}${table}</section>`;
}

/* ---------- metas y clientes ---------- */
function clientDraft(id){return drafts.c[id]||byId(id)}
function viewClients(){
  const cards=S.clients.map(c0=>{
    const c=clientDraft(c0.id),dirty=!!drafts.c[c0.id];
    return `<article class="card"><div class="chead"><h3>${av(c,'lg')}${esc(c.name)}</h3><span class="muted" style="font-size:12px">${esc(c.industry||'')}</span></div>
    <div class="fields">
      <div class="full"><label for="fu-${c.id}">Embudo</label><input id="fu-${c.id}" data-c="${c.id}" data-f="funnel" value="${esc(c.funnel)}"></div>
      <div><label for="pl-${c.id}">Plataformas</label><input id="pl-${c.id}" data-c="${c.id}" data-f="platforms" value="${esc(c.platforms)}"></div>
      <div><label for="cu-${c.id}">Moneda</label><select id="cu-${c.id}" data-c="${c.id}" data-f="currency">${['MXN','USD'].map(x=>`<option ${c.currency===x?'selected':''}>${x}</option>`).join('')}</select></div>
      ${(c.metrics||[]).map(m=>`<div><label for="g-${c.id}-${m.key}">Meta mensual · ${esc(m.label)}</label><input id="g-${c.id}-${m.key}" type="number" min="0" inputmode="numeric" data-c="${c.id}" data-f="goal" data-k="${m.key}" value="${m.goal||''}" placeholder="Sin meta"></div>`).join('')}
      <div><label for="cp-${c.id}">${esc(c.cprLabel||'Costo por resultado')} objetivo</label><input id="cp-${c.id}" type="number" min="0" data-c="${c.id}" data-f="cprTarget" value="${c.cprTarget||''}" placeholder="Sin meta"></div>
      <div><label for="bu-${c.id}">Inversión mensual</label><input id="bu-${c.id}" type="number" min="0" data-c="${c.id}" data-f="budget" value="${c.budget||''}" placeholder="Sin definir"></div>
      <div class="full"><label for="no-${c.id}">Notas</label><textarea id="no-${c.id}" data-c="${c.id}" data-f="notes">${esc(c.notes)}</textarea></div>
    </div>
    <div class="savebar"><span class="${dirty?'dirty':''}">${dirty?'Cambios sin guardar':'Una meta vacía deja esa métrica como solo seguimiento.'}</span><button class="btn primary small" data-action="saveclient" data-id="${c.id}">Guardar</button></div></article>`;
  }).join('');
  return `<section class="panel" style="margin-bottom:16px"><div class="sectionhead"><h2>Cómo se calcula tu calificación</h2></div>
    <div class="formula">
      <p style="margin:0">Cada métrica con meta se compara contra lo que deberías llevar a la fecha de corte. Si la meta es 300 y vas en el día 15 de 30, lo esperado es 150. Cada métrica cuenta hasta 100%.</p>
      <p style="margin:0">Cuando hay costo por resultado objetivo, el volumen pesa 60% y el costo 40%. Sin costo objetivo, solo cuenta el volumen. Tu calificación global es el promedio de todos los clientes, y todos pesan igual.</p>
      <div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:6px">
        <div><label for="th-g">Verde desde (%)</label><input id="th-g" type="number" value="${S.settings.green}" style="width:110px"></div>
        <div><label for="th-o">Naranja desde (%)</label><input id="th-o" type="number" value="${S.settings.orange}" style="width:110px"></div>
        <button class="btn small" data-action="savesettings">Guardar umbrales</button>
        <button class="btn small ghost" data-action="logout">Cerrar sesión en este dispositivo</button>
      </div>
    </div></section>
    <section class="cfg">${cards}</section>`;
}

/* ---------- captura ---------- */
function openCapture(id){
  const c=byId(id),mk=UI.month,r=S.results[mk+'_'+id];
  const cur=monthKey(new Date());
  const asOf=r?.asOf||(mk===cur?todayKey():`${mk}-${pad(dim(mk))}`);
  const m=document.getElementById('modal');
  m.innerHTML=`<form class="sheet" id="capform" data-id="${id}">
    <div><span class="eyebrow">${monthName(mk)} · acumulado del mes</span><h2>${esc(c.name)}</h2></div>
    <div><label for="cap-asof">Números al día</label><input id="cap-asof" type="date" min="${mk}-01" max="${mk}-${pad(dim(mk))}" value="${asOf}" required></div>
    <div><label for="cap-spend">Inversión acumulada (${c.currency||'MXN'})</label><input id="cap-spend" type="number" min="0" step="0.01" inputmode="decimal" value="${r?.spend??''}"></div>
    ${(c.metrics||[]).map(x=>`<div><label for="cap-${x.key}">${esc(x.label)}${x.goal?` <span class="muted">· meta ${fmt(x.goal)}</span>`:''}</label><input id="cap-${x.key}" data-k="${x.key}" type="number" min="0" inputmode="numeric" value="${r?.values?.[x.key]??''}"></div>`).join('')}
    <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" data-action="closemodal">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div>
  </form>`;
  m.hidden=false;
  setTimeout(()=>document.getElementById('cap-spend')?.focus(),0);
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='capform')return;
  e.preventDefault();
  const f=e.target,id=f.dataset.id,c=byId(id),mk=UI.month;
  const values={};f.querySelectorAll('input[data-k]').forEach(i=>values[i.dataset.k]=Number(i.value)||0);
  const doc={month:mk,client:id,asOf:f.querySelector('#cap-asof').value||todayKey(),spend:Number(f.querySelector('#cap-spend').value)||0,values,
    goals:{metrics:(c.metrics||[]).map(m=>({key:m.key,goal:Number(m.goal)||0})),cprTarget:Number(c.cprTarget)||0,budget:Number(c.budget)||0},
    updatedAt:new Date().toISOString()};
  if(await write(()=>db.doc(`results/${mk}_${id}`).set(doc))){closeModal();toast(`Números de ${c.name} guardados`)}
});
function closeModal(){const m=document.getElementById('modal');m.hidden=true;m.innerHTML=''}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modal').hidden)closeModal()});

/* ---------- escritura ---------- */
async function write(fn){
  if(!db){toast('No hay conexión con el almacenamiento. No se guardó.');return false}
  try{await fn();return true}catch(err){
    if(err?.code==='unauthorized'){onApiError(err);return false}
    toast(err?.code==='quota_exceeded'?'El almacenamiento está lleno.':'No se pudo guardar. Intenta de nuevo.');console.warn(err);return false}
}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- edición en borrador ---------- */
function onField(e){
  const t=e.target;
  const isCheck=t.type==='checkbox';
  if(isCheck&&e.type!=='change')return;
  if(t.dataset.s){
    const sid=t.dataset.s;
    if(!drafts.s[sid])drafts.s[sid]=Object.assign(blankSession(),clone(S.sessions[sid]||{}));
    const d=drafts.s[sid],f=t.dataset.f;
    if(f==='check'){d.checks=d.checks||[];d.checks[+t.dataset.i]=t.checked}
    else if(f==='taskdone'){d.pendientes[+t.dataset.i].done=t.checked;t.closest('.task').classList.toggle('done',t.checked)}
    else d[f]=t.value;
    const lbl=document.querySelector(`[data-dirty="${sid}"]`);if(lbl){lbl.textContent='Cambios sin guardar';lbl.className='dirty'}
  }else if(t.dataset.c){
    const id=t.dataset.c;
    if(!drafts.c[id])drafts.c[id]=clone(byId(id));
    const d=drafts.c[id],f=t.dataset.f;
    if(f==='goal'){const m=d.metrics.find(x=>x.key===t.dataset.k);m.goal=Number(t.value)||0}
    else if(f==='cprTarget'||f==='budget')d[f]=Number(t.value)||0;
    else d[f]=t.value;
  }
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Enter'&&t.dataset?.f==='newtask'){e.preventDefault();addTask(t.dataset.s)}
});
function addTask(sid){
  const d=drafts.s[sid]||(drafts.s[sid]=Object.assign(blankSession(),clone(S.sessions[sid]||{})));
  const txt=(d.newtask||'').trim();if(!txt)return;
  d.pendientes=[...(d.pendientes||[]),{t:txt,done:false}];d.newtask='';
  render();document.getElementById('nt-'+sid)?.focus();
}

/* ---------- acciones ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-action]');if(!t)return;
  const a=t.dataset.action;
  if(t.tagName==='A')e.preventDefault();
  if(a==='tab'){UI.tab=t.dataset.tab;try{history.replaceState(null,'','#'+UI.tab)}catch(_){}render();window.scrollTo(0,0)}
  else if(a==='month'){UI.month=addMonths(UI.month,+t.dataset.d);render()}
  else if(a==='calmonth'){UI.calMonth=addMonths(UI.calMonth,+t.dataset.d);render()}
  else if(a==='pickday'){UI.day=t.dataset.date;UI.editDay=false;render()}
  else if(a==='gotoday'){UI.tab='calendario';UI.day=t.dataset.date;UI.calMonth=t.dataset.date.slice(0,7);render();window.scrollTo(0,0)}
  else if(a==='editbase'){UI.editBase=!UI.editBase;render()}
  else if(a==='editday'){UI.editDay=!UI.editDay;render()}
  else if(a==='capture')openCapture(t.dataset.id);
  else if(a==='closemodal')closeModal();
  else if(a==='togglebase'){
    const sch=clone(S.schedule||{}),dk=t.dataset.day,id=t.dataset.id;
    const l=sch[dk]||[];sch[dk]=l.includes(id)?l.filter(x=>x!==id):[...l,id];
    await write(()=>db.doc('config/schedule').set(sch));
  }
  else if(a==='toggleday'){
    const k=UI.day,id=t.dataset.id,l=clientsForDate(k);
    const next=l.includes(id)?l.filter(x=>x!==id):[...l,id];
    await write(()=>db.doc('days/'+k).set({date:k,clients:next}));
  }
  else if(a==='resetday'){await write(()=>db.doc('days/'+UI.day).delete());UI.editDay=false;render()}
  else if(a==='addtoday'){
    const k=todayKey(),l=clientsForDate(k);
    if(await write(()=>db.doc('days/'+k).set({date:k,clients:[...l,t.dataset.id]})))toast(`${byId(t.dataset.id).name} agregado a hoy`);
  }
  else if(a==='addtask')addTask(t.dataset.sid);
  else if(a==='deltask'){
    const sid=t.dataset.sid;
    const d=drafts.s[sid]||(drafts.s[sid]=Object.assign(blankSession(),clone(S.sessions[sid]||{})));
    d.pendientes.splice(+t.dataset.i,1);render();
  }
  else if(a==='savesession'){
    const sid=t.dataset.sid,s=sessionOf(sid);
    const doc={date:t.dataset.date,client:t.dataset.id,checks:(s.checks||[]).map(Boolean),estrategia:s.estrategia||'',aprendizajes:s.aprendizajes||'',pendientes:s.pendientes||[],updatedAt:new Date().toISOString()};
    if(s.newtask?.trim())doc.pendientes=[...doc.pendientes,{t:s.newtask.trim(),done:false}];
    if(await write(()=>db.doc('sessions/'+sid).set(doc))){delete drafts.s[sid];toast('Bitácora guardada');render()}
  }
  else if(a==='doneprev'){
    const x=S.sessions[t.dataset.sid];if(!x)return;
    const p=clone(x.pendientes||[]);p[+t.dataset.i].done=true;
    await write(()=>db.doc('sessions/'+t.dataset.sid).update({pendientes:p}));
  }
  else if(a==='saveclient'){
    const id=t.dataset.id,d=drafts.c[id];if(!d){toast('No hay cambios que guardar');return}
    const patch={funnel:d.funnel||'',platforms:d.platforms||'',currency:d.currency||'MXN',metrics:d.metrics,cprTarget:Number(d.cprTarget)||0,budget:Number(d.budget)||0,notes:d.notes||''};
    if(await write(()=>db.doc('clients/'+id).update(patch))){delete drafts.c[id];toast(`Metas de ${d.name} guardadas`);render()}
  }
  else if(a==='logout'){try{localStorage.removeItem(PASS_KEY)}catch(_){}location.reload()}
  else if(a==='savesettings'){
    const g=Number(document.getElementById('th-g').value),o=Number(document.getElementById('th-o').value);
    if(!(g>o&&o>0&&g<=100)){toast('Verde debe ser mayor que naranja, entre 1 y 100');return}
    if(await write(()=>db.doc('config/settings').set({green:g,orange:o})))toast('Umbrales guardados');
  }
});

/* ---------- conexión con la API ---------- */
const PASS_KEY='semaforo-pass';
function makeApiDb(pass){
  const docs={},listeners=[];
  const snapDoc=(id,d)=>({id,exists:d!==undefined,data:()=>d});
  function emit(){
    for(const l of listeners){
      if(l.col){const pre=l.col+'/';l.fn({docs:Object.keys(docs).filter(k=>k.startsWith(pre)).map(k=>snapDoc(k.slice(pre.length),docs[k]))})}
      else l.fn(snapDoc(l.path.split('/')[1],docs[l.path]));
    }
  }
  async function api(method,body){
    let r;
    try{r=await fetch('/api/data',{method,headers:{'content-type':'application/json','x-pass':pass},body:body&&JSON.stringify(body)})}
    catch(_){throw {code:'offline'}}
    if(r.status===401)throw {code:'unauthorized'};
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw {code:'server',message:j.error||'Error del servidor'};
    return j;
  }
  async function refresh(){const j=await api('GET');for(const k of Object.keys(docs))delete docs[k];Object.assign(docs,j.docs||{});emit()}
  async function write(op,path,data){
    const had=path in docs,prev=docs[path];
    if(op==='delete')delete docs[path];else docs[path]=op==='update'?{...(prev||{}),...data}:data;
    emit();
    try{await api('POST',op==='delete'?{op,path}:{op:'set',path,data:docs[path]})}
    catch(e){if(had)docs[path]=prev;else delete docs[path];emit();throw e}
  }
  return {
    refresh,
    doc:path=>({set:d=>write('set',path,d),update:d=>write('update',path,d),delete:()=>write('delete',path),onSnapshot:fn=>{listeners.push({path,fn});return()=>{}}}),
    collection:col=>({onSnapshot:fn=>{listeners.push({col,fn});return()=>{}}}),
  };
}
let loginError='';
function loginView(){
  return `<div class="login"><form class="sheet" id="loginform"><div><span class="eyebrow">Acceso privado</span><h2>Entra a tu tablero</h2></div>
    <div><label for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password" required></div>
    ${loginError?`<p style="margin:0;color:var(--bad)">${esc(loginError)}</p>`:''}
    <button class="btn primary" type="submit">Entrar</button></form></div>`;
}
function onApiError(e){
  if(e?.code==='unauthorized'){try{localStorage.removeItem(PASS_KEY)}catch(_){}db=null;S.needLogin=true;loginError='La contraseña cambió o no es válida. Escríbela de nuevo.';render()}
  else if(e?.code==='offline'){S.dbOk=false;render()}
  else{console.warn(e);toast(e?.message||'Error del servidor')}
}
let pollT;
async function connect(pass){
  const api=makeApiDb(pass);
  const col=(name,fn)=>api.collection(name).onSnapshot(q=>fn(q.docs));
  col('clients',docs=>{S.clients=docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0))});
  col('results',docs=>{S.results=Object.fromEntries(docs.map(d=>[d.id,d.data()]))});
  col('days',docs=>{S.days=Object.fromEntries(docs.map(d=>[d.id,d.data()]))});
  col('sessions',docs=>{S.sessions=Object.fromEntries(docs.map(d=>[d.id,d.data()]))});
  api.doc('config/schedule').onSnapshot(s=>{S.schedule=s.exists?s.data():null});
  api.doc('config/settings').onSnapshot(s=>{S.settings={green:90,orange:70,...(s.exists?s.data():{})};S.loaded=true;S.dbOk=true;scheduleRender()});
  await api.refresh();
  db=api;S.needLogin=false;loginError='';
  try{localStorage.setItem(PASS_KEY,pass)}catch(_){}
  const tick=()=>{if(document.visibilityState==='visible'&&db===api)api.refresh().then(()=>{if(S.dbOk===false){S.dbOk=true;render()}}).catch(onApiError)};
  clearInterval(pollT);pollT=setInterval(tick,30000);
  document.addEventListener('visibilitychange',tick);
  render();
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='loginform')return;
  e.preventDefault();
  const pass=document.getElementById('lp').value;
  const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='Entrando…';
  try{await connect(pass)}
  catch(err){
    loginError=err?.code==='unauthorized'?'Contraseña incorrecta.':err?.code==='offline'?'Sin conexión a internet.':(err?.message||'No se pudo entrar.');
    S.needLogin=true;render();
  }
});

/* ---------- arranque ---------- */
const h=(location.hash||'').slice(1);if(['panel','calendario','historico','clientes'].includes(h))UI.tab=h;
let saved=null;try{saved=localStorage.getItem(PASS_KEY)}catch(_){}
if(!saved){S.needLogin=true;render()}
else{render();(function boot(){connect(saved).catch(e=>{if(e?.code==='unauthorized')onApiError(e);else{S.dbOk=false;render();setTimeout(boot,15000)}})})()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
